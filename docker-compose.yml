name: resolve-weave

services:
  app:
    build: .
    image: resolve-weave:local
    command: sh -c "npm run db:seed && npm run dev"
    ports:
      - "127.0.0.1:5173:5173"
      - "127.0.0.1:3001:3001"
    environment:
      NODE_ENV: development
      PORT: 3001
      JWT_SECRET: ${JWT_SECRET:?Set-JWT_SECRET-in-.env}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set-ADMIN_PASSWORD-in-.env}
      DB_PATH: /app/data/customer-service.db
      ALLOWED_ORIGINS: http://localhost:5173
      EMBED_PROVIDER: other
      VECTOR_STORE_PROVIDER: ${VECTOR_STORE_PROVIDER:-memory}
      QDRANT_URL: ${QDRANT_URL:-}
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      QDRANT_COLLECTION_PREFIX: ${QDRANT_COLLECTION_PREFIX:-resolveweave_knowledge}
      QDRANT_COLLECTION_ALIAS: ${QDRANT_COLLECTION_ALIAS:-resolveweave_knowledge_active}
      QDRANT_TIMEOUT_MS: ${QDRANT_TIMEOUT_MS:-5000}
      RETRIEVAL_TRACE_RETENTION_DAYS: ${RETRIEVAL_TRACE_RETENTION_DAYS:-30}
      OCR_SERVICE_URL: ${OCR_SERVICE_URL:-}
      OCR_SERVICE_TOKEN: ${OCR_SERVICE_TOKEN:-}
    volumes:
      - resolve-weave-data:/app/data

  ocr-worker:
    profiles: ["ocr"]
    restart: unless-stopped
    build:
      context: ./ocr-worker
    image: resolve-weave-ocr:local
    environment:
      PADDLE_DEVICE: cpu
      OCR_WORKER_TOKEN: ${OCR_SERVICE_TOKEN:-}
      OCR_PROCESSING_TIMEOUT_SECONDS: ${OCR_PROCESSING_TIMEOUT_SECONDS:-120}
    ports:
      - "127.0.0.1:8001:8001"

  qdrant:
    profiles: ["qdrant"]
    image: qdrant/qdrant:v1.18.2
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - resolve-weave-qdrant:/qdrant/storage

volumes:
  resolve-weave-data:
    name: ${RESOLVE_WEAVE_DATA_VOLUME:-resolve-weave-data}
  resolve-weave-qdrant:
    name: ${RESOLVE_WEAVE_QDRANT_VOLUME:-resolve-weave-qdrant}
