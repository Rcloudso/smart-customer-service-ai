name: resolve-weave

services:
  app:
    build: .
    image: resolve-weave:local
    command: sh -c "npm run db:seed && npm run dev"
    ports:
      - "5173:5173"
      - "3001:3001"
    environment:
      NODE_ENV: development
      PORT: 3001
      JWT_SECRET: change-this-local-secret
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: admin123
      DB_PATH: /app/data/customer-service.db
      ALLOWED_ORIGINS: http://localhost:5173
      EMBED_PROVIDER: other
      OCR_SERVICE_URL: ${OCR_SERVICE_URL:-}
    volumes:
      - resolve-weave-data:/app/data

  ocr-worker:
    profiles: ["ocr"]
    build:
      context: ./ocr-worker
    image: resolve-weave-ocr:local
    environment:
      OCR_ENGINE_VERSION: 3.0.0
      PADDLE_DEVICE: cpu
      OCR_WORKER_TOKEN: ${OCR_SERVICE_TOKEN:-}
    ports:
      - "8001:8001"

volumes:
  resolve-weave-data:
    name: ${RESOLVE_WEAVE_DATA_VOLUME:-resolve-weave-data}
