name: OCR restart smoke

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ocr-restart-smoke.yml"
      - "docker-compose.yml"
      - "ocr-worker/**"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/ocr-restart-smoke.yml"
      - "docker-compose.yml"
      - "ocr-worker/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ocr-restart-smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  restart-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Verify OCR timeout restart and recovery
        env:
          OCR_SERVICE_TOKEN: restart-smoke-token-123
        run: bash ocr-worker/tests/verify_restart_smoke.sh
