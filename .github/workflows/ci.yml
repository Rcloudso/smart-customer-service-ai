name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Run OCR worker contract tests
        run: (cd ocr-worker && python -m unittest discover -s tests)

      - name: Install dependencies
        run: npm ci

      - name: Run regression tests
        run: EMBED_PROVIDER=other npm test
        env:
          JWT_SECRET: test-secret-123

      - name: Run retrieval evaluations
        run: |
          EMBED_PROVIDER=other npm run eval:faq
          EMBED_PROVIDER=other npm run eval:document
          EMBED_PROVIDER=other npm run eval:mixed
          EMBED_PROVIDER=other npm run eval:quality
          EMBED_PROVIDER=other npm run eval:ocr
        env:
          JWT_SECRET: test-secret-123

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: PLAYWRIGHT_CHANNEL=chromium npm run test:e2e

      - name: Build
        run: EMBED_PROVIDER=other npm run build
        env:
          JWT_SECRET: test-secret-123

  qdrant-integration:
    runs-on: ubuntu-latest
    services:
      qdrant:
        image: qdrant/qdrant:v1.18.2
        ports:
          - 6333:6333

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Wait for Qdrant
        run: curl --fail --retry 20 --retry-delay 1 --retry-connrefused http://127.0.0.1:6333/readyz

      - name: Run Qdrant integration
        run: npm run test:qdrant
        env:
          QDRANT_URL: http://127.0.0.1:6333
          JWT_SECRET: test-secret-123
